[workspace]
authors = ["deepthought <deepthough@postech.ac.kr>"]
channels = ["nvidia", "conda-forge"]
name = "PXDesign"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.1"  # Specify your CUDA version

[tasks]

[dependencies]
python = "3.11.*"
pip = ">=26.1.1,<27"
cuda-version = "12.1.*"
cuda-compiler = "12.1.*"
cuda-libraries = "12.1.*"
cuda-libraries-dev = "12.1.*"
cuda-cudart-dev = "12.1.*"
gxx_linux-64 = "11.*"
sysroot_linux-64 = "2.28"
numpy = "1.26.3.*"
einops = ">=0.8.2,<0.9"
natsort = ">=8.4.0,<9"
dm-tree = ">=0.1.10,<0.2"
posix_ipc = ">=1.3.2,<2"
cudnn = ">=8.9,<9"
transformers = "4.51.3.*"

[pypi-dependencies]
dm-haiku = "==0.0.13"
optax = "==0.2.5"
chex = "==0.1.87"
protenix = { git = "https://github.com/bytedance/Protenix.git", rev = "v0.5.0+pxd" }
colabdesign = { git = "https://github.com/sokrypton/ColabDesign.git" }
pxdbench = { git = "https://github.com/bytedance/PXDesignBench.git", rev = "v0.1.2" }
pxdesign = { path = ".", editable = true }
deepspeed = "==0.15.1"
jax = "==0.4.35"
jaxlib = "==0.4.35"
