[workspace]
name = "pxdesign"
version = "0.1.0"
description = "PXDesign environment managed with pixi"
authors = ["deepthought <deepthought@postech.ac.kr>"]
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", cuda = "12.1" }]

[dependencies]
python = "3.11.*"
pip = "*"
git = "*"
cudnn = ">=8.9"
cuda-nvcc = "12.1.*"
cuda-toolkit = "12.1.*"

[activation]
env = { CUDA_HOME = "$CONDA_PREFIX", CPATH = "$CONDA_PREFIX/targets/x86_64-linux/include:$CPATH", CPLUS_INCLUDE_PATH = "$CONDA_PREFIX/targets/x86_64-linux/include:$CPLUS_INCLUDE_PATH" }

[pypi-options]
no-build-isolation = ["colabdesign", "pxdbench"]
find-links = [{ url = "https://storage.googleapis.com/jax-releases/jax_cuda_releases.html" }]
extra-index-urls = ["https://download.pytorch.org/whl/cu121"]

[pypi-dependencies]
# 1) Core Deep Learning (PyTorch & JAX CUDA)
torch = "==2.3.1+cu121"
jax = { version = "==0.4.29", extras = ["cuda"] }
numpy = "==1.26.3"

# 2) Protenix & Design Repos
protenix = { git = "https://github.com/bytedance/Protenix.git", tag = "v0.5.0+pxd" }
colabdesign = { git = "https://github.com/sokrypton/ColabDesign.git" }
pxdbench = { git = "https://github.com/bytedance/PXDesignBench.git", tag = "v0.1.2" }
pxdesign = { path = ".", editable = true }

# 3) Model & Benchmark Dependencies
transformers = "==4.51.3"
dm-haiku = "==0.0.13"
optax = "==0.2.5"
einops = "*"
natsort = "*"
dm-tree = "*"
posix_ipc = "*"
scipy = "*"
rdkit = "*"
biopython = "==1.83"
modelcif = "==0.7"
biotite = "==1.0.1"
scikit-learn = "*"
scikit-learn-extra = "*"
deepspeed = ">=0.15.1, <0.18.0"
protobuf = "==3.20.2"
icecream = "*"
ipdb = "*"
wandb = "*"
matplotlib = "==3.9.2"
ipywidgets = "*"
py3Dmol = "*"
fair-esm = "*"
ml_collections = "*"
PyYAML = "*"
tqdm = "*"
pandas = "*"
optree = "*"

[tasks]
test = { cmd = "python -c 'import torch, jax, colabdesign, protenix, pxdbench, pxdesign; print(\"[OK] All modules imported successfully!\"); print(\"CUDA:\", torch.cuda.is_available(), \"JAX Devices:\", jax.devices())'" }
run = { cmd = "pxdesign pipeline --help" }
